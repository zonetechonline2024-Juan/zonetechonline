<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago cancelado — ZoneTechOnline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050d1a;
      color: #e2e8f0;
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      background: rgba(251,113,133,.12);
      border: 2px solid rgba(251,113,133,.35);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .icon svg { width: 40px; height: 40px; color: #fb7185; }
    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: .75rem; color: #f8fafc; }
    p { color: #94a3b8; line-height: 1.6; margin-bottom: 2rem; }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      text-decoration: none;
      padding: .875rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: .95rem;
      transition: opacity .2s;
      margin-right: .75rem;
    }
    .btn:hover { opacity: .85; }
    .btn-ghost {
      display: inline-block;
      background: transparent;
      border: 1px solid rgba(255,255,255,.15);
      color: #94a3b8;
      text-decoration: none;
      padding: .875rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: .95rem;
      transition: border-color .2s, color .2s;
    }
    .btn-ghost:hover { border-color: rgba(255,255,255,.3); color: #e2e8f0; }
    .actions { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; }
    .logo { font-size: .9rem; color: #475569; margin-top: 2rem; letter-spacing: .05em; }
    .logo span { color: #6366f1; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </div>
    <h1>Pago cancelado</h1>
    <p>No se ha realizado ningún cargo. Tu carrito sigue guardado — puedes intentarlo de nuevo cuando quieras.</p>
    <div class="actions">
      <a href="index.html" class="btn">Volver a la tienda</a>
    </div>
    <div class="logo">ZONE<span>TECH</span>ONLINE</div>
  </div>
</body>
</html>
