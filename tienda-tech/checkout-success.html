<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago exitoso — ZoneTechOnline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050d1a;
      color: #e2e8f0;
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      background: rgba(52,211,153,.15);
      border: 2px solid rgba(52,211,153,.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .icon svg { width: 40px; height: 40px; color: #34d399; }
    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: .75rem; color: #f8fafc; }
    p { color: #94a3b8; line-height: 1.6; margin-bottom: 2rem; }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      text-decoration: none;
      padding: .875rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: .95rem;
      transition: opacity .2s;
    }
    .btn:hover { opacity: .85; }
    .logo { font-size: .9rem; color: #475569; margin-top: 2rem; letter-spacing: .05em; }
    .logo span { color: #6366f1; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h1>¡Pago completado!</h1>
    <p>Tu pedido ha sido procesado correctamente. Recibirás un email de confirmación en breve con los detalles de tu compra.</p>
    <a href="index.html" class="btn">Seguir comprando</a>
    <div class="logo">ZONE<span>TECH</span>ONLINE</div>
  </div>
  <script>
    // Limpiar el carrito tras pago exitoso
    localStorage.removeItem('zt_cart');
  </script>
</body>
</html>
