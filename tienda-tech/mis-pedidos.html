<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0FVJFMXJWB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-0FVJFMXJWB');
    gtag('config', 'AW-16672492666');
  </script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Mis Pedidos — ZoneTechOnline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--bg:#08080f;--bg-card:#0e0e1a;--bg-card2:#12122a;--border:rgba(255,255,255,.08);--border-h:rgba(255,255,255,.14);--text:#f0f0fa;--text-2:#a0a0c0;--text-3:#606080;--accent:#6366f1;--accent-2:#a855f7;--green:#34d399;--gold:#fbbf24;}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}

    .top-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);background:rgba(8,8,15,.95);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100;}
    .logo{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;text-decoration:none;color:var(--text);letter-spacing:.05em;}
    .logo span{color:var(--accent);}
    .back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-3);text-decoration:none;transition:color .2s;}
    .back-link:hover{color:var(--text);}

    .page{max-width:760px;margin:0 auto;padding:40px 20px 80px;}

    .page-header{margin-bottom:32px;}
    .page-title{font-family:'Space Grotesk',sans-serif;font-size:clamp(22px,4vw,30px);font-weight:700;letter-spacing:-.02em;margin-bottom:6px;}
    .page-sub{font-size:14px;color:var(--text-3);}

    /* Empty state */
    .empty{text-align:center;padding:80px 20px;}
    .empty-icon{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(168,85,247,.12));display:flex;align-items:center;justify-content:center;margin:0 auto 24px;}
    .empty h2{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;margin-bottom:10px;}
    .empty p{font-size:14px;color:var(--text-3);line-height:1.7;max-width:340px;margin:0 auto 28px;}
    .btn-shop{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;text-decoration:none;padding:13px 28px;border-radius:100px;font-size:14px;font-weight:600;}
    .btn-shop:hover{opacity:.88;}

    /* Order cards */
    .order-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;margin-bottom:16px;overflow:hidden;transition:border-color .2s;}
    .order-card:hover{border-color:var(--border-h);}
    .order-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap;}
    .order-num{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:var(--accent);}
    .order-date{font-size:12px;color:var(--text-3);}
    .order-status{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;background:rgba(52,211,153,.1);color:var(--green);border:1px solid rgba(52,211,153,.2);border-radius:20px;padding:4px 10px;}
    .order-status::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);}
    .order-body{padding:16px 20px;}
    .order-items-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
    .oi{display:flex;align-items:center;gap:12px;}
    .oi-img{width:44px;height:44px;border-radius:8px;background:var(--bg-card2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
    .oi-img img{width:100%;height:100%;object-fit:cover;}
    .oi-name{font-size:13px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .oi-qty{font-size:12px;color:var(--text-3);flex-shrink:0;}
    .oi-price{font-size:13px;font-weight:600;flex-shrink:0;}
    .order-footer{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border);flex-wrap:wrap;gap:8px;}
    .order-method{font-size:12px;color:var(--text-3);}
    .order-total-label{font-size:12px;color:var(--text-3);}
    .order-total{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:var(--accent);}
    .order-total-wrap{text-align:right;}

    /* Payment icons */
    .pay-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text-3);background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:6px;padding:3px 8px;}

    @media(max-width:480px){
      .order-head{flex-direction:column;align-items:flex-start;}
    }
  </style>
</head>
<body>

<nav class="top-nav">
  <a class="logo" href="index.html">ZONE<span>TECH</span>ONLINE</a>
  <a class="back-link" href="mi-cuenta.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12H4M4 12l6-6M4 12l6 6"/></svg>
    Mi cuenta
  </a>
</nav>

<div class="page">
  <div class="page-header">
    <h1 class="page-title">Mis pedidos</h1>
    <p class="page-sub" id="orders-sub">Cargando historial...</p>
  </div>

  <div id="orders-container"></div>
</div>

<script>
(function() {
  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

  var user = null;
  try { user = JSON.parse(localStorage.getItem('zt_user') || 'null'); } catch(e) {}
  if (!user) { window.location.href = 'login.html'; return; }

  var orders = [];
  try { orders = JSON.parse(localStorage.getItem('zt_orders') || '[]'); } catch(e) {}

  var container = document.getElementById('orders-container');
  var sub = document.getElementById('orders-sub');

  if (!orders.length) {
    sub.textContent = '0 pedidos realizados';
    container.innerHTML =
      '<div class="empty">' +
        '<div class="empty-icon"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="1.4"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></div>' +
        '<h2>No tienes pedidos todavía</h2>' +
        '<p>Cuando completes una compra, aparecerá aquí con todos los detalles.</p>' +
        '<a class="btn-shop" href="catalogo.html">Explorar productos</a>' +
      '</div>';
    return;
  }

  sub.textContent = orders.length + (orders.length === 1 ? ' pedido realizado' : ' pedidos realizados');

  var methodLabels = { card: '💳 Tarjeta', bizum: '📱 Bizum', paypal: '🅿️ PayPal' };

  function fmt(n) {
    return Number(n).toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
  }

  container.innerHTML = orders.map(function(order) {
    var dateStr = order.date
      ? new Date(order.date).toLocaleDateString('es-ES', { day: '2-digit', month: 'long', year: 'numeric' })
      : '—';
    var method = methodLabels[order.paymentMethod] || '💳 Tarjeta';
    var itemsHtml = (order.items || []).slice(0, 3).map(function(item) {
      var imgHtml = item.image
        ? '<img src="' + esc(item.image) + '" alt="" onerror="this.style.display=\'none\'">'
        : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:.3"><rect x="2" y="7" width="20" height="15" rx="2"/></svg>';
      return '<div class="oi">' +
        '<div class="oi-img">' + imgHtml + '</div>' +
        '<div class="oi-name">' + esc(item.name) + '</div>' +
        '<div class="oi-qty">×' + esc(item.qty || 1) + '</div>' +
        '<div class="oi-price">' + fmt(item.price * (item.qty || 1)) + '</div>' +
      '</div>';
    }).join('');
    var extraItems = (order.items || []).length - 3;
    if (extraItems > 0) itemsHtml += '<div style="font-size:12px;color:var(--text-3);padding:4px 0;">+ ' + extraItems + ' producto' + (extraItems > 1 ? 's' : '') + ' más</div>';

    return '<div class="order-card">' +
      '<div class="order-head">' +
        '<div>' +
          '<div class="order-num">' + (order.orderNo || '#ZT-—') + '</div>' +
          '<div class="order-date">' + dateStr + '</div>' +
        '</div>' +
        '<div class="order-status">Entregado</div>' +
      '</div>' +
      '<div class="order-body">' +
        '<div class="order-items-list">' + itemsHtml + '</div>' +
        '<div class="order-footer">' +
          '<div class="order-method"><span class="pay-chip">' + method + '</span></div>' +
          '<div class="order-total-wrap">' +
            '<div class="order-total-label">Total pagado</div>' +
            '<div class="order-total">' + fmt(order.total || 0) + '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
})();
</script>
</body>
</html>
