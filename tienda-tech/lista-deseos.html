<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Lista de Deseos — ZoneTechOnline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--bg:#08080f;--bg-card:#0e0e1a;--bg-card2:#12122a;--border:rgba(255,255,255,.08);--border-h:rgba(255,255,255,.14);--text:#f0f0fa;--text-2:#a0a0c0;--text-3:#606080;--accent:#6366f1;--accent-2:#a855f7;--red:#f87171;--green:#34d399;}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}

    .top-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);background:rgba(8,8,15,.95);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100;}
    .logo{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;text-decoration:none;color:var(--text);letter-spacing:.05em;}
    .logo span{color:var(--accent);}
    .back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-3);text-decoration:none;transition:color .2s;}
    .back-link:hover{color:var(--text);}

    .page{max-width:900px;margin:0 auto;padding:40px 20px 80px;}

    .page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:32px;flex-wrap:wrap;}
    .page-title{font-family:'Space Grotesk',sans-serif;font-size:clamp(22px,4vw,30px);font-weight:700;letter-spacing:-.02em;margin-bottom:6px;}
    .page-sub{font-size:14px;color:var(--text-3);}
    .btn-clear{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--red);background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.18);border-radius:8px;padding:8px 14px;cursor:pointer;font-family:'Inter',sans-serif;transition:background .2s;}
    .btn-clear:hover{background:rgba(248,113,113,.15);}

    /* Empty */
    .empty{text-align:center;padding:80px 20px;}
    .empty-icon{width:80px;height:80px;border-radius:50%;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.14);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;}
    .empty h2{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;margin-bottom:10px;}
    .empty p{font-size:14px;color:var(--text-3);line-height:1.7;max-width:340px;margin:0 auto 28px;}
    .btn-shop{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;text-decoration:none;padding:13px 28px;border-radius:100px;font-size:14px;font-weight:600;}
    .btn-shop:hover{opacity:.88;}

    /* Grid */
    .wl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;}
    .wl-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:border-color .2s,transform .2s;}
    .wl-card:hover{border-color:var(--border-h);transform:translateY(-3px);}
    .wl-img{height:180px;display:flex;align-items:center;justify-content:center;background:var(--bg-card2);position:relative;overflow:hidden;}
    .wl-img img{width:100%;height:100%;object-fit:contain;padding:16px;}
    .wl-img-ph{display:flex;align-items:center;justify-content:center;width:100%;height:100%;}
    .wl-remove{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(248,113,113,.15);border:1px solid rgba(248,113,113,.3);color:var(--red);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s;font-size:0;}
    .wl-remove:hover{background:rgba(248,113,113,.3);}
    .wl-info{padding:14px;}
    .wl-brand{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-bottom:5px;}
    .wl-name{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;line-height:1.3;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .wl-price{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;color:var(--accent);margin-bottom:12px;}
    .wl-actions{display:flex;gap:8px;}
    .btn-add-cart{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .2s;}
    .btn-add-cart:hover{opacity:.88;}
    .btn-add-cart.added{background:linear-gradient(135deg,#34d399,#059669);}

    /* Toast */
    .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--bg-card);border:1px solid var(--border-h);border-radius:12px;padding:12px 20px;font-size:13px;font-weight:500;color:var(--text);box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:9999;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    @media(max-width:480px){.wl-grid{grid-template-columns:1fr 1fr;}}
    @media(max-width:360px){.wl-grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>

<nav class="top-nav">
  <a class="logo" href="index.html">ZONE<span>TECH</span>ONLINE</a>
  <a class="back-link" href="mi-cuenta.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12H4M4 12l6-6M4 12l6 6"/></svg>
    Mi cuenta
  </a>
</nav>

<div class="page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Lista de deseos</h1>
      <p class="page-sub" id="wl-sub">Cargando...</p>
    </div>
    <button class="btn-clear" id="btn-clear" style="display:none;" onclick="clearAll()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
      Vaciar lista
    </button>
  </div>

  <div id="wl-container"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  function getCart() { try { return JSON.parse(localStorage.getItem('zt_cart') || '[]'); } catch(e) { return []; } }
  function saveCart(c) { localStorage.setItem('zt_cart', JSON.stringify(c)); }
  function getWishlist() { try { return JSON.parse(localStorage.getItem('zt_wishlist') || '[]'); } catch(e) { return []; } }
  function saveWishlist(w) { localStorage.setItem('zt_wishlist', JSON.stringify(w)); }

  var toastEl = document.getElementById('toast');
  var toastTimer;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toastEl.classList.remove('show'); }, 2800);
  }

  function fmt(n) { return Number(n).toLocaleString('es-ES', { style: 'currency', currency: 'EUR' }); }

  function render() {
    var wl = getWishlist();
    var sub = document.getElementById('wl-sub');
    var container = document.getElementById('wl-container');
    var btnClear = document.getElementById('btn-clear');

    if (!wl.length) {
      sub.textContent = '0 productos guardados';
      btnClear.style.display = 'none';
      container.innerHTML =
        '<div class="empty">' +
          '<div class="empty-icon"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="1.4"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>' +
          '<h2>Tu lista de deseos está vacía</h2>' +
          '<p>Guarda los productos que más te gusten haciendo clic en el corazón ❤️ de cualquier artículo.</p>' +
          '<a class="btn-shop" href="catalogo.html">Explorar productos</a>' +
        '</div>';
      return;
    }

    sub.textContent = wl.length + (wl.length === 1 ? ' producto guardado' : ' productos guardados');
    btnClear.style.display = '';

    var cart = getCart();
    container.innerHTML = '<div class="wl-grid">' + wl.map(function(item) {
      var imgHtml = item.image
        ? '<img src="' + item.image + '" alt="' + item.name + '" onerror="this.parentNode.innerHTML=\'<div class=wl-img-ph><svg width=40 height=40 viewBox=\\\"0 0 24 24\\\" fill=none stroke=currentColor stroke-width=1.2 style=opacity:.2><rect x=2 y=7 width=20 height=15 rx=2/></svg></div>\'">'
        : '<div class="wl-img-ph"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" style="opacity:.2"><rect x="2" y="7" width="20" height="15" rx="2"/></svg></div>';
      var inCart = cart.some(function(c) { return c.id === item.id; });
      return '<div class="wl-card" id="wl-card-' + item.id + '">' +
        '<div class="wl-img">' +
          imgHtml +
          '<button class="wl-remove" onclick="removeItem(' + item.id + ')" title="Eliminar de la lista">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
          '</button>' +
        '</div>' +
        '<div class="wl-info">' +
          '<div class="wl-brand">' + (item.brand || '') + '</div>' +
          '<div class="wl-name">' + item.name + '</div>' +
          '<div class="wl-price">' + fmt(item.price) + '</div>' +
          '<div class="wl-actions">' +
            '<button class="btn-add-cart' + (inCart ? ' added' : '') + '" id="btn-cart-' + item.id + '" onclick="addToCart(' + item.id + ')">' +
              '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>' +
              (inCart ? 'En el carrito' : 'Añadir al carrito') +
            '</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('') + '</div>';
  }

  window.removeItem = function(id) {
    var wl = getWishlist();
    wl = wl.filter(function(i) { return i.id !== id; });
    saveWishlist(wl);
    var card = document.getElementById('wl-card-' + id);
    if (card) {
      card.style.transition = 'opacity .25s,transform .25s';
      card.style.opacity = '0';
      card.style.transform = 'scale(.92)';
      setTimeout(function() { render(); }, 260);
    }
    showToast('Eliminado de tu lista de deseos');
  };

  window.clearAll = function() {
    if (!confirm('¿Vaciar toda la lista de deseos?')) return;
    saveWishlist([]);
    render();
    showToast('Lista de deseos vaciada');
  };

  window.addToCart = function(id) {
    var wl = getWishlist();
    var item = null;
    wl.forEach(function(i) { if (i.id === id) item = i; });
    if (!item) return;
    var cart = getCart();
    var existing = null;
    cart.forEach(function(c) { if (c.id === id) existing = c; });
    if (existing) {
      existing.qty = (existing.qty || 1) + 1;
    } else {
      cart.push({ id: item.id, name: item.name, brand: item.brand || '', price: item.price, image: item.image || '', category: item.category || '', qty: 1 });
    }
    saveCart(cart);
    var btn = document.getElementById('btn-cart-' + id);
    if (btn) { btn.classList.add('added'); btn.textContent = ''; btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> En el carrito'; }
    showToast('✓ ' + item.name + ' añadido al carrito');
    // Update cart badge on window if available
    if (window.updateCartBadge) window.updateCartBadge();
  };

  render();
})();
</script>
</body>
</html>
